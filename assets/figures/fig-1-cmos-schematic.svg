<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" role="img" aria-label="CMOS inverter: standard MOSFET schematic">
<defs><style>
.t{font-family:Arial,Helvetica,sans-serif;fill:#18384a}
.title{font-family:Arial,Helvetica,sans-serif;fill:#193c50;font-size:26px;font-weight:750}
.subtitle{font-family:Arial,Helvetica,sans-serif;fill:#718798;font-size:17px}
.word{font-family:Arial,Helvetica,sans-serif;fill:#284555;font-size:17px;font-weight:650}
.pin{font-family:Arial,Helvetica,sans-serif;fill:#6c8494;font-size:13px;font-weight:650}
.small{font-family:Arial,Helvetica,sans-serif;fill:#657f90;font-size:14px}
.mini{font-family:Arial,Helvetica,sans-serif;fill:#8197a4;font-size:12px}
.path-text{font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:700}
.wire{fill:none;stroke:#284555;stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round}
.ground{stroke:#284555;stroke-width:3.6;stroke-linecap:round}
.rail{fill:#08758e;font-family:Arial,Helvetica,sans-serif;font-weight:750;font-size:17px}
.on{fill:#00816d;font-family:Arial,Helvetica,sans-serif;font-weight:750}
.off{fill:#c76b4f;font-family:Arial,Helvetica,sans-serif;font-weight:750}
</style>
<marker id="arrow-on" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#008f80" stroke-width="2"/></marker>
<marker id="arrow-down" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#d66b42" stroke-width="2"/></marker>
</defs>
<rect width="1000" height="570" fill="#fff"/>
<rect x="18" y="17" width="964" height="536" rx="18" fill="#fbfdff" stroke="#dce7ee" stroke-width="2"/>
<text x="52" y="65" class="title">CMOS inverter: standard MOSFET schematic</text>
<text x="52" y="97" class="subtitle">Shared input gates; common drain node produces the inverted output</text>

<path d="M577 133 V526" stroke="#dfe8ed" stroke-width="2"/>
<text x="282" y="147" class="rail">VDD</text>
<path class="wire" d="M314 157 H350 M332 157 V185 M332 265 V307 M332 307 V350 M332 430 V484"/>
<g data-device="pmos" data-schematic-symbol="enhancement-mosfet" transform="translate(332 225)"><path class="mos-channel" d="M0 -25 V25" fill="none" stroke="#164d65" stroke-width="6" stroke-linecap="square"/><path class="mos-terminals" d="M0 -40 V-25 M0 25 V40" stroke="#284555" stroke-width="3.3" fill="none"/><path class="mos-gate" d="M-30 -28 V28" stroke="#164d65" stroke-width="4" fill="none"/><circle class="gate-bubble" cx="-40" cy="0" r="8" fill="#fff" stroke="#164d65" stroke-width="3"/><text x="19" y="-27" class="pin">S</text><text x="19" y="39" class="pin">D</text></g>
<g data-device="nmos" data-schematic-symbol="enhancement-mosfet" transform="translate(332 390)"><path class="mos-channel" d="M0 -25 V25" fill="none" stroke="#164d65" stroke-width="6" stroke-linecap="square"/><path class="mos-terminals" d="M0 -40 V-25 M0 25 V40" stroke="#284555" stroke-width="3.3" fill="none"/><path class="mos-gate" d="M-30 -28 V28" stroke="#164d65" stroke-width="4" fill="none"/><text x="19" y="-27" class="pin">D</text><text x="19" y="39" class="pin">S</text></g>
<path class="wire" d="M149 225 H284 M149 225 V390 H302 M332 307 H488"/>
<circle cx="149" cy="225" r="5.5" fill="#284555"/><circle cx="332" cy="307" r="5.5" fill="#284555"/>
<path class="ground" d="M303 484 H361 M312 495 H352 M323 506 H341"/>
<text x="94" y="208" class="word">V<tspan baseline-shift="sub" font-size="12">in</tspan></text>
<text x="491" y="313" class="word">V<tspan baseline-shift="sub" font-size="12">out</tspan></text>
<text x="392" y="222" class="word">PMOS (P1)</text><text x="392" y="391" class="word">NMOS (N1)</text>
<rect x="58" y="519" width="488" height="27" rx="8" fill="#edf6f8"/>
<text x="68" y="538" class="small">PMOS source → VDD  ·  NMOS source → GND</text>
<text x="619" y="158" class="word">Static logic behavior</text>
<rect x="618" y="176" width="326" height="239" rx="12" fill="#fff" stroke="#dae5ec"/>
<rect x="619" y="177" width="324" height="57" rx="11" fill="#e9f4f7"/><rect x="619" y="220" width="324" height="15" fill="#e9f4f7"/>
<text x="640" y="213" class="small" font-weight="700">Input</text>
<text x="743" y="213" class="small" font-weight="700">P1</text>
<text x="812" y="213" class="small" font-weight="700">N1</text>
<text x="886" y="213" class="small" font-weight="700">Output</text>
<text x="642" y="276" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#284555" font-weight="750">LOW</text>
<text x="741" y="276" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#00816d" font-weight="750">ON</text>
<text x="810" y="276" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#c76b4f" font-weight="750">OFF</text>
<text x="885" y="276" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#284555" font-weight="750">HIGH</text>
<text x="642" y="347" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#284555" font-weight="750">HIGH</text>
<text x="741" y="347" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#c76b4f" font-weight="750">OFF</text>
<text x="810" y="347" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#00816d" font-weight="750">ON</text>
<text x="885" y="347" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#284555" font-weight="750">LOW</text>
<path d="M618 306 H945" stroke="#e5eef2"/>
<text x="638" y="391" class="small">Both gates are driven by the same input.</text>
<text x="620" y="453" class="small">Circuit symbol convention:</text>
<text x="620" y="480" class="small">○ at the PMOS gate; none at the NMOS.</text>
<text x="620" y="507" class="small">Bulk connections (not drawn):</text>
<text x="620" y="532" class="small">P1 bulk → VDD; N1 bulk → GND.</text>
</svg>