<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 920 450" role="img" aria-label="Original schematic and truth table of a CMOS inverter">
<defs><style>text{font-family:Inter,Arial,sans-serif;fill:#1e4054} .title{font-size:20px;font-weight:750} .sm{font-size:15px} .micro{font-size:12px} .bold{font-weight:750} .wire{fill:none;stroke:#244557;stroke-width:3;stroke-linecap:round;stroke-linejoin:round} .lightwire{fill:none;stroke:#a8bdc9;stroke-width:2.5;stroke-linecap:round} .rail{font-size:14px;font-weight:760;fill:#276e83} .device{fill:none;stroke:#196c88;stroke-width:3} .muted{fill:#7890a0} .red{fill:#d46538} .blue{fill:#1c7ab4} .teal{fill:#0f9888} </style></defs>
<rect width="100%" height="100%" fill="#ffffff" /><rect x="24" y="24" width="872" height="402" rx="18" fill="#f9fcfd" stroke="#e0eaf0"/>
<text x="47" y="60" class="title">Two complementary transistors</text><text x="47" y="88" class="sm muted">The gates share V<tspan baseline-shift="sub">in</tspan>, and the drains share V<tspan baseline-shift="sub">out</tspan>.</text>
<line x1="475" y1="56" x2="475" y2="385" stroke="#d5e3eb" stroke-width="1.6" />
<text x="575" y="63" class="title">Truth table</text>
<rect x="562" y="97" width="290" height="206" rx="12" fill="white" stroke="#d5e3eb"/>
<rect x="562" y="97" width="290" height="48" rx="12" fill="#ecf6f9"/><rect x="562" y="133" width="290" height="13" fill="#ecf6f9"/>
<text x="587" y="127" class="sm bold">V<tspan baseline-shift="sub">in</tspan></text><text x="682" y="127" class="sm bold">PMOS</text><text x="775" y="127" class="sm bold">NMOS</text>
<line x1="563" y1="195" x2="850" y2="195" stroke="#e0e8ee" />
<text x="582" y="179" class="sm bold">LOW</text><text x="677" y="179" class="sm teal bold">ON</text><text x="772" y="179" class="sm red bold">OFF</text>
<text x="582" y="237" class="sm bold">HIGH</text><text x="677" y="237" class="sm red bold">OFF</text><text x="772" y="237" class="sm teal bold">ON</text>
<text x="580" y="285" class="micro muted">V<tspan baseline-shift="sub">out</tspan> is opposite to V<tspan baseline-shift="sub">in</tspan>.</text>
<text x="581" y="344" class="sm bold" fill="#0c7996">LOW in → HIGH out</text><text x="581" y="374" class="sm bold" fill="#0c7996">HIGH in → LOW out</text>
<text x="297" y="108" class="rail">VDD</text>
<path class="wire" d="M266 112 V119 M249 119 H283"/>
<path class="wire" d="M266 119 V128 M266 191 V234 M266 275 V352"/>
<line x1="266" y1="128" x2="266" y2="191" class="device"/>
<line x1="245" y1="144" x2="245" y2="176" class="device"/>
<circle cx="236" cy="160" r="7" fill="#fff" stroke="#196c88" stroke-width="2.5"/>
<line x1="266" y1="234" x2="266" y2="275" class="device"/>
<line x1="245" y1="240" x2="245" y2="268" class="device"/>
<path class="wire" d="M120 160 H229 M120 160 V254 H245 M266 220 H367"/>
<circle cx="266" cy="220" r="6" fill="#244557"/><circle cx="120" cy="160" r="5" fill="#244557"/>
<text x="69" y="150" class="sm bold">Vin</text><text x="369" y="226" class="sm bold">Vout</text>
<text x="295" y="164" class="sm bold">PMOS</text><text x="295" y="259" class="sm bold">NMOS</text>
<path class="wire" d="M266 352 V360 M242 360 H290 M249 370 H283 M258 380 H274"/>
<text x="306" y="122" class="micro muted">Pull-up</text><text x="306" y="305" class="micro muted">Pull-down</text>
</svg>