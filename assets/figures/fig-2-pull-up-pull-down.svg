<defs><style>text{font-family:Inter,Arial,sans-serif;fill:#1e4054} .title{font-size:20px;font-weight:750} .sm{font-size:15px} .micro{font-size:12px} .bold{font-weight:750} .wire{fill:none;stroke:#244557;stroke-width:3;stroke-linecap:round;stroke-linejoin:round} .lightwire{fill:none;stroke:#a8bdc9;stroke-width:2.5;stroke-linecap:round} .rail{font-size:14px;font-weight:760;fill:#276e83} .device{fill:none;stroke:#196c88;stroke-width:3} .muted{fill:#7890a0} .red{fill:#d46538} .blue{fill:#1c7ab4} .teal{fill:#0f9888} </style></defs>
