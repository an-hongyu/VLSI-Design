<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 640" role="img" aria-label="Pull-up and pull-down operation">
<defs><style>
.t{font-family:Arial,Helvetica,sans-serif;fill:#18384a}
.title{font-family:Arial,Helvetica,sans-serif;fill:#193c50;font-size:26px;font-weight:750}
.subtitle{font-family:Arial,Helvetica,sans-serif;fill:#718798;font-size:17px}
.word{font-family:Arial,Helvetica,sans-serif;fill:#284555;font-size:17px;font-weight:650}
.pin{font-family:Arial,Helvetica,sans-serif;fill:#6c8494;font-size:13px;font-weight:650}
.small{font-family:Arial,Helvetica,sans-serif;fill:#657f90;font-size:14px}
.mini{font-family:Arial,Helvetica,sans-serif;fill:#8197a4;font-size:12px}
.path-text{font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:700}
.wire{fill:none;stroke:#284555;stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round}
.ground{stroke:#284555;stroke-width:3.6;stroke-linecap:round}
.rail{fill:#08758e;font-family:Arial,Helvetica,sans-serif;font-weight:750;font-size:17px}
.on{fill:#00816d;font-family:Arial,Helvetica,sans-serif;font-weight:750}
.off{fill:#c76b4f;font-family:Arial,Helvetica,sans-serif;font-weight:750}
</style>
<marker id="arrow-on" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#008f80" stroke-width="2"/></marker>
<marker id="arrow-down" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#d66b42" stroke-width="2"/></marker>
</defs>
<rect width="1040" height="640" fill="#fff"/>
<rect x="18" y="17" width="1004" height="606" rx="18" fill="#fbfdff" stroke="#dce7ee" stroke-width="2"/>
<text x="52" y="65" class="title">Pull-up and pull-down operation</text>
<text x="52" y="97" class="subtitle">Input LOW: PMOS pulls output HIGH     |     Input HIGH: NMOS pulls output LOW</text>

<rect x="26" y="132" width="447" height="465" rx="14" fill="#fff" stroke="#dce7ee"/>
<text x="45" y="169" class="word">Input LOW (0)</text><text x="45" y="194" class="small">P1 conducts; N1 blocks</text>
<text x="187" y="209" class="rail">VDD</text>
<path class="wire" d="M210 218 H250 M230 218 V237 M230 317 V365 M230 365 V415 M230 495 V540 M87 277 V455 M87 277 H182 M87 455 H200 M230 365 H346"/>
<g data-device="pmos" data-schematic-symbol="enhancement-mosfet" transform="translate(230 277)"><path class="mos-channel" d="M0 -25 V25" fill="none" stroke="#078977" stroke-width="6" stroke-linecap="square"/><path class="mos-terminals" d="M0 -40 V-25 M0 25 V40" stroke="#284555" stroke-width="3.3" fill="none"/><path class="mos-gate" d="M-30 -28 V28" stroke="#164d65" stroke-width="4" fill="none"/><circle class="gate-bubble" cx="-40" cy="0" r="8" fill="#fff" stroke="#164d65" stroke-width="3"/></g>
<g data-device="nmos" data-schematic-symbol="enhancement-mosfet" transform="translate(230 455)"><path class="mos-channel" d="M0 -25 V25" fill="none" stroke="#9fb2bd" stroke-width="6" stroke-linecap="square"/><path class="mos-terminals" d="M0 -40 V-25 M0 25 V40" stroke="#284555" stroke-width="3.3" fill="none"/><path class="mos-gate" d="M-30 -28 V28" stroke="#164d65" stroke-width="4" fill="none"/></g>
<circle cx="87" cy="277" r="5.5" fill="#284555"/><circle cx="230" cy="365" r="5.5" fill="#284555"/><path class="ground" d="M201 540 H259 M210 551 H250 M221 562 H239"/>
<text x="45" y="262" class="small">Vin = 0 V</text>
<text x="353" y="371" class="small">Vout = VDD</text>
<text x="277" y="284" class="small on">P1: ON</text>
<text x="277" y="462" class="small off">N1: OFF</text>
<path d="M271 296 V351" stroke="#008f80" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-on)"/>
<rect x="536" y="132" width="447" height="465" rx="14" fill="#fff" stroke="#dce7ee"/>
<text x="555" y="169" class="word">Input HIGH (1)</text><text x="555" y="194" class="small">N1 conducts; P1 blocks</text>
<text x="697" y="209" class="rail">VDD</text>
<path class="wire" d="M720 218 H760 M740 218 V237 M740 317 V365 M740 365 V415 M740 495 V540 M597 277 V455 M597 277 H692 M597 455 H710 M740 365 H856"/>
<g data-device="pmos" data-schematic-symbol="enhancement-mosfet" transform="translate(740 277)"><path class="mos-channel" d="M0 -25 V25" fill="none" stroke="#9fb2bd" stroke-width="6" stroke-linecap="square"/><path class="mos-terminals" d="M0 -40 V-25 M0 25 V40" stroke="#284555" stroke-width="3.3" fill="none"/><path class="mos-gate" d="M-30 -28 V28" stroke="#164d65" stroke-width="4" fill="none"/><circle class="gate-bubble" cx="-40" cy="0" r="8" fill="#fff" stroke="#164d65" stroke-width="3"/></g>
<g data-device="nmos" data-schematic-symbol="enhancement-mosfet" transform="translate(740 455)"><path class="mos-channel" d="M0 -25 V25" fill="none" stroke="#078977" stroke-width="6" stroke-linecap="square"/><path class="mos-terminals" d="M0 -40 V-25 M0 25 V40" stroke="#284555" stroke-width="3.3" fill="none"/><path class="mos-gate" d="M-30 -28 V28" stroke="#164d65" stroke-width="4" fill="none"/></g>
<circle cx="597" cy="277" r="5.5" fill="#284555"/><circle cx="740" cy="365" r="5.5" fill="#284555"/><path class="ground" d="M711 540 H769 M720 551 H760 M731 562 H749"/>
<text x="555" y="262" class="small">Vin = VDD</text>
<text x="863" y="371" class="small">Vout = 0 V</text>
<text x="787" y="284" class="small off">P1: OFF</text>
<text x="787" y="462" class="small on">N1: ON</text>
<path d="M781 377 V520" stroke="#008f80" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-on)"/>
<rect x="45" y="602" width="435" height="27" rx="8" fill="#e6f7f2"/>
<text x="60" y="621" fill="#00816d" font-family="Arial" font-size="15" font-weight="700">Pull-up path: VDD → PMOS → Vout</text>
<rect x="555" y="602" width="435" height="27" rx="8" fill="#e6f7f2"/>
<text x="570" y="621" fill="#00816d" font-family="Arial" font-size="15" font-weight="700">Pull-down path: Vout → NMOS → GND</text>
</svg>